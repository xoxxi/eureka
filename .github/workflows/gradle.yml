# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  CI-CD:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: docker build & hub push
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          docker build -t "${{ secrets.DOCKER_USERNAME }}/eureka:${{ github.run_number }}" .
          docker push "${{ secrets.DOCKER_USERNAME }}/eureka:${{ github.run_number }}"

      - name: Deploy to prod
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST_EC2 }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            echo "${{ secrets.DOCKER_PASSWORD }}" | sudo docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
            sudo docker pull "${{ secrets.DOCKER_USERNAME }}/eureka:${{ github.run_number }}"
            sudo docker stop eureka || true
            sudo docker rm eureka || true
            sudo docker run -d \
              --name eureka \
              --network spharos \
              -p 8761:8761 \
              "${{ secrets.DOCKER_USERNAME }}/eureka:${{ github.run_number }}"
            sudo docker image prune -a -f
          
          
